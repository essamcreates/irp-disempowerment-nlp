name: Clean-room reproduction

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          python -m pip check

      - name: Check Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Repository secret HF_TOKEN is not configured."
            echo "Add a Hugging Face read token with access to lmsys/lmsys-chat-1m, then rerun this workflow."
            exit 1
          fi

      - name: Authenticate with Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import login
          login(token=os.environ["HF_TOKEN"], add_to_git_credential=False)
          PY
          hf auth whoami

      - name: Provide Codespaces-compatible absolute path
        run: |
          sudo mkdir -p /workspaces
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspaces/irp-disempowerment-nlp

      - name: Run clean-room notebooks 01-07
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/run_cleanroom.py

      - name: Print non-text pilot diagnostics on failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from src.labelling import weak_label_disempowerment

          path = Path('data/samples/lmsys_relevance_pilot_100.csv')
          if not path.exists():
              print('Pilot CSV not available for diagnostics.')
              raise SystemExit(0)

          df = pd.read_csv(path)
          positives = []
          for _, row in df.iterrows():
              result = weak_label_disempowerment(row['user_text'], row['assistant_text'])
              if result['weak_label_any']:
                  positives.append({
                      'source_index': int(row['source_index']),
                      'pair_index': int(row['pair_index']),
                      'weak_labels': result['weak_labels'],
                  })

          print('Pilot row count:', len(df))
          print('Positive count:', len(positives))
          print('Positive identifiers/categories only:')
          for item in positives:
              print(item)
          PY
